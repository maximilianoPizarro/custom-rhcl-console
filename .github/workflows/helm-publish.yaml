name: Helm chart publish

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint chart
        run: helm lint helm/custom-rhcl-console

      - name: Template chart (smoke)
        run: |
          helm template custom-rhcl-console helm/custom-rhcl-console \
            --namespace custom-rhcl-console \
            --set consolePlugin.patchConsole=false \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          grep -q 'kind: ConsolePlugin' /tmp/rendered.yaml
          grep -q 'kind: Deployment' /tmp/rendered.yaml

  release:
    needs: lint
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Ensure gh-pages branch exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "origin/gh-pages already exists"
            exit 0
          fi
          echo "Creating orphan gh-pages branch for Helm chart index"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          printf 'apiVersion: v1\nentries: {}\ngenerated: "%s"\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > index.yaml
          echo "custom-rhcl-console Helm repository" > README.md
          git add index.yaml README.md
          git commit -m "chore: bootstrap gh-pages for Helm chart index"
          git push origin gh-pages
          git checkout main

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          config: .github/cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
