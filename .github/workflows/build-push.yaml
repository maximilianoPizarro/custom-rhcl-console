name: Build and push to Quay.io

on:
  push:
    branches: [main]
    paths:
      - "console-plugin/**"
      - "dns-prober/**"
      - ".github/workflows/build-push.yaml"
  pull_request:
    branches: [main]
    paths:
      - "console-plugin/**"
      - "dns-prober/**"
      - ".github/workflows/build-push.yaml"
  workflow_dispatch:

env:
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: maximilianopizarro
  # Single Quay repository; dns-prober uses dns-prober-* tags (avoids creating a second repo).
  IMAGE_NAME: custom-rhcl-console

jobs:
  build-and-push:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: plugin
            context: ./console-plugin
            dockerfile: ./console-plugin/Dockerfile
            tag_latest: latest
            tag_version_suffix: ""
          - component: dns-prober
            context: ./dns-prober
            dockerfile: ./dns-prober/Dockerfile
            tag_latest: dns-prober-latest
            tag_version_suffix: "dns-prober-"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve application version
        run: |
          source scripts/lib/version.sh
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$VERSION_V" >> "$GITHUB_ENV"
          if [ -n "${{ matrix.tag_version_suffix }}" ]; then
            echo "COMPONENT_VERSION_TAG=${{ matrix.tag_version_suffix }}${VERSION_V}" >> "$GITHUB_ENV"
            echo "COMPONENT_SHA_TAG=${{ matrix.tag_version_suffix }}${GITHUB_SHA}" >> "$GITHUB_ENV"
          else
            echo "COMPONENT_VERSION_TAG=${VERSION_V}" >> "$GITHUB_ENV"
            echo "COMPONENT_SHA_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Login to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to registry.access.redhat.com
        uses: docker/login-action@v3
        with:
          registry: registry.access.redhat.com
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Login to registry.redhat.io
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }}
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          tags: |
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:pr-${{ matrix.component }}-${{ github.event.pull_request.number }}

      - name: Build and push ${{ matrix.component }}
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          tags: |
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ matrix.tag_latest }}
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.COMPONENT_VERSION_TAG }}
            ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.COMPONENT_SHA_TAG }}
