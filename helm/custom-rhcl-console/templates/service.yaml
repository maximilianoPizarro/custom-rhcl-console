apiVersion: v1
kind: Service
metadata:
  name: {{ include "custom-rhcl-console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "custom-rhcl-console.labels" . | nindent 4 }}
    {{- include "custom-rhcl-console.selectorLabels" . | nindent 4 }}
  annotations:
    # Triggers the OpenShift service-CA operator to mint a TLS cert+key
    # Secret and rotate it before expiry. The pod mounts the same Secret.
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.service.servingCertSecretName }}
spec:
  selector:
    {{- include "custom-rhcl-console.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
